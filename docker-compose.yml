services:
  postgres:
    image: ${DOCKER_HUB_PREFIX:-docker.m.daocloud.io/}library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neogate}
      POSTGRES_USER: ${POSTGRES_USER:-neogate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neogate-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        DOCKER_HUB_PREFIX: ${DOCKER_HUB_PREFIX:-docker.m.daocloud.io/}
        CARGO_REGISTRY_MIRROR: ${CARGO_REGISTRY_MIRROR:-sparse+https://mirrors.ustc.edu.cn/crates.io-index/}
        CARGO_HTTP_TIMEOUT: ${CARGO_HTTP_TIMEOUT:-600}
        CARGO_HTTP_LOW_SPEED_LIMIT: ${CARGO_HTTP_LOW_SPEED_LIMIT:-1}
        CARGO_NET_RETRY: ${CARGO_NET_RETRY:-10}
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - BIND_ADDR=0.0.0.0:8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-neogate}:${POSTGRES_PASSWORD:-neogate-change-me}@postgres:5432/${POSTGRES_DB:-neogate}
      - NEOGATE_ENV_FILE=/app-config/.env
      # Optional. Set PUBLIC_BASE_URL in the host environment or project .env
      # to force a canonical URL; when absent, /install infers it from request headers.
      - PUBLIC_BASE_URL
      - RUNTIME_MODE=standalone
      - SITE_NAME=${SITE_NAME:-NeoGate}
      - USAGE_QUEUE_SIZE=${USAGE_QUEUE_SIZE:-32768}
      - USAGE_FLUSH_INTERVAL_MS=${USAGE_FLUSH_INTERVAL_MS:-200}
    volumes:
      - backend-config:/app-config
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        DOCKER_HUB_PREFIX: ${DOCKER_HUB_PREFIX:-docker.m.daocloud.io/}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  backend-config:
