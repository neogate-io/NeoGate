<svg xmlns="http://www.w3.org/2000/svg" width="784" height="400" viewBox="0 0 784 400" role="img" aria-labelledby="title desc">
  <title id="title">Run the NeoGate install command</title>
  <desc id="desc">Terminal screenshot showing the shell install command.</desc>
  <g transform="translate(-88 -70)">
  <rect x="88" y="70" width="784" height="400" rx="14" fill="#0f172a"/>
  <rect x="88" y="70" width="784" height="46" rx="14" fill="#172033"/>
  <circle cx="118" cy="93" r="7" fill="#f87171"/>
  <circle cx="142" cy="93" r="7" fill="#fbbf24"/>
  <circle cx="166" cy="93" r="7" fill="#34d399"/>
  <text x="198" y="99" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">Terminal</text>
  <text x="124" y="166" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">$</text>
  <text x="150" y="166" fill="#e5edf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">curl -fsSL https://neogate.example/install | bash</text>
  <text x="124" y="220" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Downloading NeoGate installer...</text>
  <text x="124" y="258" fill="#22c55e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">NeoGate installer</text>
  <text x="124" y="296" fill="#e5edf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Service: https://neogate.example</text>
  <text x="124" y="334" fill="#e5edf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Press Enter to continue</text>
  </g>
</svg>
