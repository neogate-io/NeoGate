[package]
name = "neogate"
version = "0.2.0"
edition = "2021"
rust-version = "1.94"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
aes = "0.8.4"
aes-gcm = "0.10.3"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["macros", "json", "multipart"] }
base64 = "0.22.1"
bytes = "1.11.1"
cbc = "0.1.2"
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
futures-util = "0.3.32"
http = "1.4.1"
hmac = "0.13.0"
hex = "0.4.3"
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
md-5 = "0.11.0"
rand = "0.10.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_urlencoded = "0.7.1"
sha1 = "0.11.0-rc.3"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "uuid"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }
redis = { version = "1.2.1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
