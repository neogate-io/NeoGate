services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neogate}
      POSTGRES_USER: ${POSTGRES_USER:-neogate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neogate-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-neogate}:${POSTGRES_PASSWORD:-neogate-change-me}@postgres:5432/${POSTGRES_DB:-neogate}
      NEOGATE_ENV_FILE: /app-config/.env
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      RUNTIME_MODE: standalone
      SITE_NAME: ${SITE_NAME:-NeoGate}
      USAGE_QUEUE_SIZE: ${USAGE_QUEUE_SIZE:-32768}
      USAGE_FLUSH_INTERVAL_MS: ${USAGE_FLUSH_INTERVAL_MS:-200}
    volumes:
      - backend-config:/app-config
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://backend:8080
      NEOGATE_PUBLIC_ORIGIN: ${PUBLIC_BASE_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  backend-config:
