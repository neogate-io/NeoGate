[package]
name = "neogate-scheduler"
version = "0.3.3"
edition = "2021"
rust-version = "1.94"
license = "AGPL-3.0-only"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.102"
base64 = "0.22.1"
chrono = "0.4.44"
dotenvy = "0.15.7"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
redis = { version = "1.2.1", default-features = false, features = ["tokio-comp", "connection-manager"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
