<svg xmlns="http://www.w3.org/2000/svg" width="784" height="400" viewBox="0 0 784 400" role="img" aria-labelledby="title desc">
  <title id="title">Answer automatic configuration prompts</title>
  <desc id="desc">Terminal screenshot showing API key, client, and model prompts.</desc>
  <g transform="translate(-88 -70)">
  <rect x="88" y="70" width="784" height="400" rx="14" fill="#0f172a"/>
  <rect x="88" y="70" width="784" height="46" rx="14" fill="#172033"/>
  <circle cx="118" cy="93" r="7" fill="#f87171"/>
  <circle cx="142" cy="93" r="7" fill="#fbbf24"/>
  <circle cx="166" cy="93" r="7" fill="#34d399"/>
  <text x="198" y="99" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">NeoGate installer</text>
  <text x="124" y="158" fill="#e5edf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">NeoGate API key:</text>
  <rect x="286" y="136" width="280" height="34" rx="6" fill="#1e293b"/>
  <text x="302" y="158" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">sk-neogate-********</text>
  <text x="124" y="216" fill="#e5edf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Choose client [1-2]:</text>
  <text x="154" y="254" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">1. Codex CLI</text>
  <text x="154" y="292" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">2. Claude Code</text>
  <text x="124" y="362" fill="#e5edf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Model:</text>
  <rect x="194" y="340" width="160" height="34" rx="6" fill="#1e293b"/>
  <text x="210" y="362" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">gpt-5.5</text>
  </g>
</svg>
